const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const weekdayOf=iso=>iso?WD[new Date(iso+'T12:00:00').getDay()]:'';
/* which hall runs on a given date. Only one hall ever runs a given weekday, so
   the date picks the hall — the operator does not have to know the pattern. */
function hallForDate(iso){
  const wd=weekdayOf(iso);
  const halls=[...new Set(SLOTS.filter(s=>s.weekday===wd).map(s=>s.hall))];
  return halls.length===1?halls[0]:null;
}

/* ============ derived totals (shared across stations) ============ */
const T={};
function compute(){
  T.online=DATA.sales.filter(s=>s.channel==='online').reduce((a,s)=>a+ +s.value,0);
  T.pos   =DATA.sales.filter(s=>s.channel==='pos').reduce((a,s)=>a+ +s.value,0);
  T.bonus =S.bonus.items.reduce((a,i)=>a+(i.issued-i.ret)*i.price,0);
  T.runnerSold=S.runners.reduce((a,r)=>a+sum(r.checkouts)-sum(r.returned)-sum(r.unsold),0);
  T.runnerCash=S.runners.reduce((a,r)=>a+sum(r.cash),0);
  T.runnerCredit=S.runners.reduce((a,r)=>a+sum(r.credit),0);
  T.runnerSmFlash=S.runners.reduce((a,r)=>a+sum(r.smFlash),0);
  T.runnerBuyin=S.runners.reduce((a,r)=>a+sum(r.buyin),0);
  T.runnerStart=S.runners.reduce((a,r)=>a+r.start,0);
  T.runnerOut=S.runners.reduce((a,r)=>a+sum(r.checkouts),0);
  T.runnerRet=S.runners.reduce((a,r)=>a+sum(r.returned),0);
  T.runnerUnsold=S.runners.reduce((a,r)=>a+sum(r.unsold),0);
  T.runnerSmCherry=S.runners.reduce((a,r)=>a+sum(r.smCherry||[0]),0);
  T.runnerLgFlash=S.runners.reduce((a,r)=>a+sum(r.lgFlash||[0]),0);
  T.runnerLgCherry=S.runners.reduce((a,r)=>a+sum(r.lgCherry||[0]),0);
  /* ---- flash ticket reconciliation (Flash Runners tab, rows 56-62) ----
     These are TICKET COUNTS, not dollars — the spreadsheet formats them as
     currency, which is a display bug there. Every figure is derived.        */
  T.fxOpenedPre = S.flashPre.reduce((a,f)=>a+(+f.tickets||0)*(+f.boxes||1),0);   // 'Pre-Order Flash'!D6
  T.fxSoldPre   = S.flashPre.reduce((a,f)=>a+(+f.presold||0),0);                 // SUM(Sales!C53:C68)
  T.fxRemainder = T.fxOpenedPre - T.fxSoldPre;                                   // B58 = B56-B57
  T.fxOnsite    = S.flashOnsite.reduce((a,f)=>a+(+f.tickets||0)*(+f.boxes||1),0);// ' On Site Flash'!D6
  T.fxUnsold    = T.runnerUnsold;                                                // B60 = D53
  T.fxSoldSess  = T.fxRemainder + T.fxOnsite - T.fxUnsold;                       // B61
  T.fxReported  = T.runnerOut - T.runnerRet - T.runnerUnsold;                    // C54 (SOLD)
  T.fxOverShort = T.fxReported - T.fxSoldSess;                                   // B62
  T.cherry=S.cherry.reduce((a,m)=>a+cherrySold(m)*m.p,0);
  T.cherryBad=S.cherry.filter(m=>(m.begin||m.end)&&cherrySold(m)<0).length;
  T.strip=S.strip.reduce((a,g)=>a+ +g.total,0);
  T.flashCaller=[...S.flashPre,...S.flashOnsite].reduce((a,f)=>a+(+f.caller||0)*(f.boxes||1),0);
  T.flashLarge =[...S.flashPre,...S.flashOnsite].reduce((a,f)=>a+(+f.large||0)*(f.boxes||1),0);
  T.flashSmall =[...S.flashPre,...S.flashOnsite].reduce((a,f)=>a+(+f.small||0)*(f.boxes||1),0);
  T.pmFixed=S.pm.fixed.reduce((a,r)=>a+ +r.v,0);
  T.pmRedeem=S.pm.redeem.reduce((a,r)=>a+ +r.v,0);
  T.pmAdj=S.pm.adj.reduce((a,r)=>a+ +r.v,0);
  T.hotAdded=S.pm.hot.reduce((a,h)=>a+h.added,0);
  T.hotPaid=hotPaidTotal();   // Gremlin pays its full amount when hit
  T.cashCounted=S.cashCount.reduce((a,d)=>a+d.q*d.v,0);
  // money identity
  T.sales = T.online+T.pos+T.bonus+T.cherry+T.runnerSold;
  T.payouts = T.strip+T.flashCaller+T.pmFixed+T.pmRedeem+T.pmAdj+T.hotAdded+T.hotPaid+T.runnerSmFlash;
  T.net = T.sales-T.payouts;
  T.pmStartOut = (S.pos||[]).reduce((a,c)=>a+(+c.start||0),0)+S.bonus.start+T.runnerStart;
  T.cashReturned = (S.pos||[]).reduce((a,c)=>a+(+c.cash||0),0)+S.bonus.cash+T.runnerCash;
  T.posCredit = (S.pos||[]).reduce((a,c)=>a+(+c.credit||0),0);
  T.credit = T.online + T.posCredit + S.bonus.credit + T.runnerCredit;
  T.pmStart = (S.pm.starts||[]).reduce((a,x)=>a+(+x.v||0),0);
  T.deposit = T.cashCounted - T.pmStart + T.credit;
  /* Attendance = bodies through the door. People = seats or heads, which differ
     at Santa Clara where an evening has no seat map. RPA and RPP are the two
     numbers the halls are actually judged on. */
  T.attendance = (+COUNTS.online_attendance||0) + (+COUNTS.pos_attendance||0);
  T.people     = (+COUNTS.online_people||0)     + (+COUNTS.pos_people||0);
  T.rpa = T.attendance ? T.sales / T.attendance : 0;
  T.rpp = T.people     ? T.sales / T.people     : 0;
  T.os = T.deposit - T.net;

  /* ---- RULE: every station's over/(short) must reach the summary ----------
     The old workbook read the wrong cell for POS on 27 of 28 sessions and read
     the Bonus cart on none of them, so "the stations all reconcile" could not
     be checked. Every station is computed here and the residual is named.   */
  T.stationOS = {
    'POS stations'  : (S.pos||[]).reduce((a,c)=>a+(+c.cash||0)-(+c.start||0),0) - T.pos
                      + T.posCredit,
    'Bonus Station' : S.bonus.cash+S.bonus.credit+S.bonus.flashRet+S.bonus.cherryRet-T.bonus-S.bonus.start,
    'Flash runners' : S.runners.reduce((a,r)=>a
        - (sum(r.checkouts)-sum(r.returned)-sum(r.unsold))
        + sum(r.smFlash)+sum(r.cash)+sum(r.credit)+sum(r.buyin)-r.start, 0),
    'Flash tickets' : T.fxOverShort,
    'Paymaster'     : T.cashCounted - (T.pmStart - T.pmStartOut + T.cashReturned - T.payouts)
  };
  T.stationTotal = Object.values(T.stationOS).reduce((a,b)=>a+b,0);
  T.undetermined = T.os - T.stationTotal;
}

/* ============================================================================
   PERSISTENCE — your entries live separately from this file's code.
   Everything is autosaved to browser storage under a key unique to this
   hall+date, so rebuilding the app file does NOT wipe your work. Every
   approval also forces an immediate save. Use "Save file" for a durable
   copy you can keep in the folder (and hand back to me to reload).
   ========================================================================= */
/* keyed to the session on screen, not to whatever was baked in at build time.
   Using a fixed key meant a new night reopened the previous night's approvals. */
function skey(){
  const s=S.session||{hall:DATA.session.hall_id||'rwc',date:DATA.session.session_date,slot:''};
  return `recon:${s.hall}:${s.date}${s.slot?':'+s.slot.replace(/\s+/g,''):''}`;
}
const SVER=1;
let saveState={ok:null,at:null};

function snapshot(){
  /* Everything the workbook builder needs, at the top level where it looks for
     it. The ingested sales and per-station cash were missing, which is why the
     exported Summary came out with the right layout and no figures. */
  const sess=S.session||{};
  return {v:SVER, savedAt:new Date().toISOString(),
          session:{hall:sess.hall||DATA.session.hall_id,
                   hallName:sess.hallName,
                   date:sess.date||DATA.session.session_date,
                   weekday:sess.weekday||DATA.session.weekday,
                   time:sess.time, slot:sess.slot,
                   ecom:DATA.session.ecom_session_id},
          label:sessionLabel(),
          sales:DATA.sales,            // itemised online + POS, as ingested
          cash:(DATA.cash||[]).map(c=>({station:c.station,
                 cash_in:+c.cash_in||0, start_cash:+c.start_cash||0,
                 credit_in:+c.credit_in||0})),
          counts:COUNTS,
          hotball_ledger:hotballLedger(),
          totals:{sales:T.sales, payouts:T.payouts, net:T.net,
                  attendance:T.attendance, people:T.people, rpa:T.rpa, rpp:T.rpp,
                  deposit:T.deposit, over_short:T.os,
                  cash_counted:T.cashCounted, credit:T.credit},
          state:S};
}
function saveNow(){
  if(!S.session) return false;        // nothing to save until a session is open
  try{
    localStorage.setItem(skey(), JSON.stringify(snapshot()));
    saveState={ok:true,at:new Date()};
  }catch(e){ saveState={ok:false,at:null}; }
  drawSave(); return saveState.ok;
}
let saveTimer=null;
function autosave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,600); }

function applySnapshot(snap){
  if(!snap||!snap.state) return false;
  // The ingested figures travel WITH the session. Without this a file opened on
  // a different build showed that build's baked-in sales under this session's
  // name — which is exactly how SC 8-14 came to display RWC 8-11 items.
  if(Array.isArray(snap.sales)){
    DATA.sales.length=0; snap.sales.forEach(x=>DATA.sales.push(x));
  }
  if(Array.isArray(snap.cash)){
    DATA.cash.length=0; snap.cash.forEach(x=>DATA.cash.push(x));
  }
  if(snap.counts) Object.assign(COUNTS, snap.counts);
  if(snap.session){
    DATA.session.hall_id      = snap.session.hall || DATA.session.hall_id;
    DATA.session.session_date = snap.session.date || DATA.session.session_date;
    DATA.session.weekday      = snap.session.weekday || DATA.session.weekday;
  }
  Object.keys(snap.state).forEach(k=>{ S[k]=snap.state[k]; });
  return true;
}
function loadSaved(){
  try{
    const raw=localStorage.getItem(skey()); if(!raw) return false;
    const snap=JSON.parse(raw);
    if(applySnapshot(snap)){ saveState={ok:true,at:new Date(snap.savedAt)}; return true; }
  }catch(e){}
  return false;
}

/* ---- writing to a real file --------------------------------------------
   The first time you approve a station the browser asks you to pick the data
   file (once). Every approval after that writes to that same file silently.
   Browsers that lack the File System Access API fall back to a download.  */
let fileHandle=null;
/* Named for the session actually open. Saturday and Sunday at Santa Clara run
   twice, so those carry AM or PM; every other night is unambiguous from the
   date alone.   e.g.  RWC 2026-08-11.json   ·   SC 2026-08-16 PM.json        */
function sessionLabel(){
  const s=S.session; if(!s) return null;
  const twice=SLOTS.filter(x=>x.hall===s.hall&&x.weekday===s.weekday).length>1;
  const part=twice ? ' '+(s.time<'16:00'?'AM':'PM') : '';
  return `${s.hall.toUpperCase()} ${s.date}${part}`;
}
function fileName(){ return (sessionLabel()||'session')+'.json'; }
async function writeHandle(){
  if(!fileHandle) return false;
  try{ const w=await fileHandle.createWritable();
       await w.write(JSON.stringify(snapshot(),null,2)); await w.close();
       saveState={ok:true,at:new Date(),file:fileHandle.name}; drawSave(); return true;
  }catch(e){ return false; }
}
async function connectFile(){
  if(!window.showSaveFilePicker) return false;
  try{ fileHandle=await window.showSaveFilePicker({suggestedName:fileName(),
         types:[{description:'Session data',accept:{'application/json':['.json']}}]});
       return await writeHandle();
  }catch(e){ return false; }          // user cancelled
}
async function saveToFile(){          // called by every approval
  if(fileHandle) { if(await writeHandle()) return true; }
  if(window.showSaveFilePicker){ if(await connectFile()) return true; }
  saveFile(); return true;            // download fallback
}

function saveFile(){
  const name=fileName();
  const b=new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  saveNow();
}
function loadFile(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const snap=JSON.parse(r.result);
      if(snap.session && snap.session.date!==DATA.session.session_date &&
         !confirm('That file is for '+snap.session.date+', not '+DATA.session.session_date+'. Load it anyway?')) return;
      applySnapshot(snap); saveNow(); render();
    }catch(e){ alert('That file could not be read as a session snapshot.'); } };
  r.readAsText(f); input.value='';
}
function discardSaved(){
  if(!confirm('Discard the saved entries for this session and start from the pre-loaded defaults?')) return;
  try{ localStorage.removeItem(skey()); }catch(e){}
  location.reload();
}
function drawSave(){
  const el=document.getElementById('savebar'); if(!el) return;
  const t=saveState.at?saveState.at.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'';
  const txt = saveState.ok===false
    ? '<span class="sv bad">Not autosaving — use Save file</span>'
    : (saveState.ok ? `<span class="sv ok">Saved ${t}</span>` : '<span class="sv">Not saved yet</span>');
  el.innerHTML = txt +
    (fileHandle?` <span class="sv ok">&rarr; ${fileHandle.name}</span>`:'') +
    ' <button class="btn ghost sm" onclick="connectFile()">'+(fileHandle?'Change file':'Connect file')+'</button>' +
    ' <button class="btn ghost sm" onclick="saveFile()">Download</button>' +
    ' <label class="btn ghost sm" style="cursor:pointer">Load file' +
      '<input type="file" accept="application/json" style="display:none" onchange="loadFile(this)"></label>' +
    ' <button class="btn ghost sm" onclick="discardSaved()">Discard</button>';
}


/* ---- hotball carry-forward ledger ----------------------------------------
   hit / paid out is not just a payout line: it decides the pot the NEXT
   session opens with, and downstream documents read it. Scope matters —
   the $5 Hotball is a per-hall pot (RWC and SC run their own), while the
   Mega Hotball is a SINGLE pot shared by both halls, so a hit at either
   hall resets it for both.                                               */
function hotballLedger(){
  return S.pm.hot.map(x=>{
    const full   = x.kind==='full';
    const total  = full ? (+x.added||0) : (+x.carry||0)+(+x.added||0);
    // a pot pays out whatever was paid; Gremlin pays the whole amount
    const paid   = x.hit ? (full ? total : (+x.paid||0)) : 0;
    // a hit LOWERS the pot by the payout — it does not zero it
    const computed = Math.max(0, total - paid);
    const ovr = (x.endAmt!==''&&x.endAmt!==null&&x.endAmt!==undefined);
    return { key:x.key, name:x.n, kind:x.kind||'pot', scope:x.scope||'shared',
             applies_to:(x.scope==='shared')?['rwc','sc']:[x.scope],
             hall:DATA.session.hall_id, session_date:DATA.session.session_date,
             carry_over:+x.carry||0, added:+x.added||0, total:total,
             was_hit:!!x.hit, paid_out:paid,
             carry_forward: ovr ? (+x.endAmt||0) : computed,
             is_expense: x.kind==='full' && !!x.hit,   // only Gremlin
             rolls_over: false,                        // always keyed in by hand
             overridden: ovr, computed_carry_forward: computed,
             override_reason: ovr ? (x.endWhy||'') : null };
  });
}
/* A pot hit is NOT a new expense — the money was expensed as it was added,
   session by session. Paying it out only lowers the pot. Gremlin is the
   exception: it is funded once for the night, so a Gremlin hit IS an expense.
   Nothing rolls forward automatically. The closing figure is recorded here and
   keyed in at the start of the next session. */
function hotPaidTotal(){
  return hotballLedger().filter(l=>l.kind==='full').reduce((a,l)=>a+l.paid_out,0);
}
function vLedger(){
  return `<div class="card"><h3>Hotball carry-forward <span class="pill db">saved for the next session</span></h3>
    <p class="ch"><b>Nothing here rolls over on its own</b> — the closing figure is recorded for the record and keyed in at the start of the next session. A hit does <b>not</b> zero a pot; it comes down by the amount paid. The $5 Hotball is a Redwood City pot; the Mega Hotball is one pot shared with Santa Clara, so a hit at either hall lowers it for both. Gremlin is funded once for the night, so a Gremlin hit is <b>an expense of the session</b>; a Hotball or Mega hit is not, because that money was expensed as it went in.</p>
    <table><thead><tr><th class="l">Pot</th><th class="l">Applies to</th><th>Total</th><th>Hit</th><th>Paid out</th><th>Expense?</th><th>Closing</th></tr></thead><tbody>
    ${hotballLedger().map(l=>`<tr><td class="l">${l.name}${l.overridden?' <span class="pill man">overridden</span>':''}</td>
      <td class="l"><span class="pill ${l.scope==='shared'?'du':'db'}">${l.scope==='shared'?'RWC + SC — shared pot':'RWC only'}</span></td>
      <td>${money(l.total)}</td><td>${l.was_hit?'yes':'no'}</td><td>${money(l.paid_out)}</td>
      <td class="mini">${l.is_expense?'yes — Gremlin':'no'}</td>
      <td class="os">${money(l.carry_forward)}</td></tr>`).join('')}
    </tbody></table></div>`;
}

AAABVgAQAeGwvY29tbWVudHNtZXRhMVBLAQIUABQACAgIAAyAlVx/yWK8TwEAAAQCAAAQAAAAAAAAAAAAAAAAAOCBBAB4bC9jb21tZW50c21ldGEwUEsBAhQAFAAICAgADICVXKO7OIb/AQAALRIAABMAAAAAAAAAAAAAAAAAbYMEAFtDb250ZW50X1R5cGVzXS54bWxQSwUGAAAAADUANQC2DgAArYUEAAAA";
const XLSX_BUILDER_PY="#!/usr/bin/env python3\n\"\"\"\nBuild a session workbook whose Summary tab is visually identical to the one\nstaff already read, with every other tab restructured to the way this system\nactually computes a session.\n\n    python3 build_workbook.py session-2026-08-11-rwc.json\n\nThe Summary sheet is lifted from the master template untouched \u2014 same labels,\nfonts, borders, number formats, column widths, merged cells. Only its formulas\nare repointed, and each one now looks itself up by its own label:\n\n    C15  =SUMIF(Payouts!$A:$A, $A15, Payouts!$C:$C)\n\nSo a payout reaches the Summary because its name matches, not because it landed\non the right row. That removes the whole class of failure the audit found: on\n27 of 28 historical workbooks the Summary read the cherries row for the POS\nover/short, and nothing ever read the Bonus cart at all.\n\nUnderneath, the tabs are flat and additive rather than positional:\n\n    Sales     one row per item sold, with channel and category\n    Payouts   one row per payout, with category\n    Stations  one row per station: what it sold, took, and reconciles to\n    Flash     one row per box opened\n    Strip     one row per strip game\n    Runners   one row per runner, plus the ticket reconciliation\n    Cherry    one row per machine\n    Deposit   the denomination count\n    Hotball   the carry-forward ledger\n    Audit     every rule check, and whether it passed\n\"\"\"\nimport openpyxl, json, io, datetime\nfrom openpyxl.styles import Font, Alignment, PatternFill, Border, Side\nfrom openpyxl.utils import get_column_letter\n\nTEMPLATE = None\n\nHDR = Font(bold=True, size=9, color=\"FFFFFF\")\nHDRFILL = PatternFill(\"solid\", fgColor=\"2F5496\")\nBOLD = Font(bold=True)\nMUTED = Font(size=9, color=\"808080\")\nTHIN = Side(style=\"thin\", color=\"D9D9D9\")\nBOX = Border(top=THIN, bottom=THIN, left=THIN, right=THIN)\nMONEY = '#,##0;[Red](#,##0)'\nNUMFMT = '#,##0'\n\n\ndef sheet(wb, name, widths):\n    ws = wb.create_sheet(name)\n    for i, w in enumerate(widths, 1):\n        ws.column_dimensions[get_column_letter(i)].width = w\n    return ws\n\n\ndef header(ws, row, labels):\n    for i, t in enumerate(labels, 1):\n        c = ws.cell(row, i, t)\n        c.font = HDR; c.fill = HDRFILL; c.border = BOX\n        c.alignment = Alignment(horizontal=\"center\" if i > 1 else \"left\")\n    ws.freeze_panes = ws.cell(row + 1, 1)\n\n\ndef put(ws, row, vals, fmt=None, bold=False):\n    for i, v in enumerate(vals, 1):\n        c = ws.cell(row, i, v)\n        if bold: c.font = BOLD\n        if fmt and i >= (fmt.get(\"from\", 2)) and isinstance(v, (int, float)):\n            c.number_format = fmt.get(\"f\", MONEY)\n    return row + 1\n\n\n# --------------------------------------------------------------------- tabs\ndef tab_sales(wb, S, snap):\n    ws = sheet(wb, \"Sales\", [38, 14, 12, 12, 9, 10, 13])\n    ws[\"A1\"] = \"Itemised sales\"; ws[\"A1\"].font = Font(bold=True, size=13)\n    ws[\"A2\"] = \"Every line the session sold. The Summary reads this by category.\"\n    ws[\"A2\"].font = MUTED\n    header(ws, 4, [\"Item\", \"Category\", \"Channel\", \"Station\", \"Qty\", \"Unit\", \"Value\"])\n    r = 5\n    for s in snap.get(\"sales\", []):\n        qty = float(s.get(\"qty\") or 0); val = float(s.get(\"value\") or 0)\n        r = put(ws, r, [s.get(\"item_name\"), s.get(\"category\"), s.get(\"channel\"),\n                        s.get(\"station_code\") or \"\", qty,\n                        round(val / qty, 2) if qty else 0, val],\n                fmt={\"from\": 5, \"f\": MONEY})\n    for it in S.get(\"bonus\", {}).get(\"items\", []):\n        sold = float(it.get(\"issued\") or 0) - float(it.get(\"ret\") or 0)\n        if not sold: continue\n        r = put(ws, r, [it.get(\"item\"), \"Strips\", \"bonus\", \"bonus\", sold,\n                        it.get(\"price\") or 0, sold * float(it.get(\"price\") or 0)],\n                fmt={\"from\": 5, \"f\": MONEY})\n    last = r - 1\n    ws.cell(r + 1, 1, \"TOTAL\").font = BOLD\n    c = ws.cell(r + 1, 7, f\"=SUM(G5:G{last})\"); c.font = BOLD; c.number_format = MONEY\n    ws.auto_filter.ref = f\"A4:G{max(last,5)}\"\n\n    # ---- roll-up the Summary reads.\n    # Buy-in always lands in Strips. The old sheet carried a \"does paper take a\n    # share?\" switch (RWC Sales!I74, SC Sales!I73) with a 4% rate. Retired by\n    # ruling \u2014 it read \"No\" with $0 to paper in all 28 historical workbooks.\n    ws[\"I3\"] = \"Summary category\"; ws[\"I3\"].font = HDR; ws[\"I3\"].fill = HDRFILL\n    ws[\"J3\"] = \"Value\"; ws[\"J3\"].font = HDR; ws[\"J3\"].fill = HDRFILL\n    ws.column_dimensions[\"I\"].width = 24; ws.column_dimensions[\"J\"].width = 14\n    cats = [(\"Flash\", f'=SUMIF($B$5:$B${last},\"Flash\",$G$5:$G${last})'),\n            (\"Cherries\", \"=Cherry!G100\"),\n            (\"Paper\", f'=SUMIF($B$5:$B${last},\"Paper\",$G$5:$G${last})'),\n            (\"Discounts/ $25 Redwood\", \"0\"),\n            (\"Strips\", f'=SUMIF($B$5:$B${last},\"Strips\",$G$5:$G${last})+J10'),\n            (\"Merchandise\", f'=SUMIF($B$5:$B${last},\"Merch\",$G$5:$G${last})')]\n    for i, (nm, f) in enumerate(cats):\n        ws.cell(4 + i, 9, nm)\n        cc = ws.cell(4 + i, 10, f); cc.number_format = MONEY\n    ws[\"I10\"] = \"Buy-in taken (all to strips)\"\n    ws[\"J10\"] = f'=SUMIF($B$5:$B${last},\"Buy-In\",$G$5:$G${last})'\n    ws.cell(10, 10).number_format = MONEY\n    ws[\"I12\"] = \"Buy-in has no Summary line of its own; it is counted inside Strips.\"\n    ws[\"I12\"].font = MUTED\n    return last\n\n\ndef tab_payouts(wb, S, snap, T):\n    \"\"\"One row per payout. Labels match the Summary's own labels exactly.\"\"\"\n    ws = sheet(wb, \"Payouts\", [34, 16, 13, 40])\n    ws[\"A1\"] = \"Payouts\"; ws[\"A1\"].font = Font(bold=True, size=13)\n    ws[\"A2\"] = \"The Summary looks each of these up by name, not by row.\"\n    ws[\"A2\"].font = MUTED\n    header(ws, 4, [\"Payout\", \"Category\", \"Amount\", \"Note\"])\n    r = 5\n    strip = sum(float(g.get(\"total\") or 0) for g in S.get(\"strip\", []))\n    r = put(ws, r, [\"Strip Game Payouts\", \"Strip\", strip,\n                    f\"{len(S.get('strip',[]))} games\"], fmt={\"from\": 3})\n    r = put(ws, r, [\"Flash Game Payouts\", \"Flash\", T[\"flashCaller\"],\n                    \"caller / colour\"], fmt={\"from\": 3})\n    pm = S.get(\"pm\", {})\n    for x in pm.get(\"fixed\", []):\n        r = put(ws, r, [x[\"n\"], \"Fixed game\", float(x.get(\"v\") or 0), \"\"], fmt={\"from\": 3})\n    for x in pm.get(\"redeem\", []):\n        r = put(ws, r, [\"Paymaster: \" + x[\"n\"], \"Redemption\", float(x.get(\"v\") or 0), \"\"],\n                fmt={\"from\": 3})\n    for x in pm.get(\"adj\", []):\n        r = put(ws, r, [x[\"n\"], \"Adjustment\", float(x.get(\"v\") or 0), \"\"], fmt={\"from\": 3})\n    r = put(ws, r, [\"Small Flash Redeemed\", \"Redemption\", T[\"runnerSmFlash\"],\n                    \"from the runners\"], fmt={\"from\": 3})\n    r = put(ws, r, [\"Small Cherry Redeemed\", \"Redemption\", T[\"runnerSmCherry\"], \"\"],\n            fmt={\"from\": 3})\n    r = put(ws, r, [\"Flash Desk: Large Cherry Redeemed\", \"Redemption\", T[\"runnerLgCherry\"], \"\"],\n            fmt={\"from\": 3})\n    r = put(ws, r, [\"Flash Desk: Large Flash Redeemed\", \"Redemption\", T[\"runnerLgFlash\"], \"\"],\n            fmt={\"from\": 3})\n    for l in snap.get(\"hotball_ledger\", []):\n        r = put(ws, r, [l[\"name\"], \"Hotball\", l[\"added\"], \"added to the pot\"], fmt={\"from\": 3})\n        if l[\"was_hit\"]:\n            r = put(ws, r, [l[\"name\"] + \" paid out\", \"Hotball\", l[\"paid_out\"], \"hit\"],\n                    fmt={\"from\": 3})\n    ws.cell(r + 1, 1, \"TOTAL PAYOUTS\").font = BOLD\n    c = ws.cell(r + 1, 3, f\"=SUM(C5:C{r-1})\"); c.font = BOLD; c.number_format = MONEY\n    ws.auto_filter.ref = f\"A4:D{max(r-1,5)}\"\n    return r + 1\n\n\ndef tab_stations(wb, S, snap, T):\n    \"\"\"Every station, every over/(short). Nothing is left unreported.\"\"\"\n    ws = sheet(wb, \"Stations\", [22, 13, 13, 13, 12, 13, 13])\n    ws[\"A1\"] = \"Station reconciliation\"; ws[\"A1\"].font = Font(bold=True, size=13)\n    # the Summary reads attendance from B2 \u2014 online orders with a buy-in, plus POS buy-ins\n    cts = snap.get(\"counts\") or {}\n    att = float(cts.get(\"online_attendance\") or 0) + float(cts.get(\"pos_attendance\") or 0)\n    ws[\"A2\"] = \"Attendance\"; ws[\"B2\"] = att; ws[\"B2\"].number_format = NUMFMT\n    ws[\"C2\"] = \"people\"; ws[\"D2\"] = float(cts.get(\"online_people\") or 0) + float(cts.get(\"pos_people\") or 0)\n    ws[\"D2\"].number_format = NUMFMT\n    ws[\"A2\"] = (\"Every station appears here and every one reaches the Summary. \"\n                \"The old workbook read the wrong cell for POS and never read the Bonus cart.\")\n    ws[\"A2\"].font = MUTED\n    header(ws, 4, [\"Station\", \"Sales\", \"Cash in\", \"Credit in\", \"Start cash\",\n                   \"Other returns\", \"Over/(Short)\"])\n    r = 5\n    first = r\n    online = sum(float(s[\"value\"]) for s in snap.get(\"sales\", []) if s.get(\"channel\") == \"online\")\n    r = put(ws, r, [\"Online / pre-order\", online, 0, online, 0, 0, 0], fmt={\"from\": 2})\n    for c in snap.get(\"cash\", []):\n        code = c.get(\"station\")\n        sold = sum(float(s[\"value\"]) for s in snap.get(\"sales\", [])\n                   if s.get(\"channel\") == \"pos\" and s.get(\"station_code\") == code)\n        cash = float(c.get(\"cash_in\") or 0); start = float(c.get(\"start_cash\") or 0)\n        cred = float(c.get(\"credit_in\") or 0)\n        ws.cell(r, 1, f\"POS {code}\")\n        for i, v in enumerate([sold, cash, cred, start, 0], 2):\n            cc = ws.cell(r, i, v); cc.number_format = MONEY\n        cc = ws.cell(r, 7, f\"=C{r}+D{r}+F{r}-B{r}-E{r}\"); cc.number_format = MONEY\n        r += 1\n    b = S.get(\"bonus\", {})\n    ws.cell(r, 1, \"Bonus Station\")\n    for i, v in enumerate([T[\"bonus\"], b.get(\"cash\", 0), b.get(\"credit\", 0), b.get(\"start\", 0),\n                           (b.get(\"flashRet\", 0) or 0) + (b.get(\"cherryRet\", 0) or 0)], 2):\n        cc = ws.cell(r, i, v); cc.number_format = MONEY\n    ws.cell(r, 7, f\"=C{r}+D{r}+F{r}-B{r}-E{r}\").number_format = MONEY\n    r += 1\n    ws.cell(r, 1, \"Flash runners\")\n    for i, v in enumerate([T[\"runnerSold\"], T[\"runnerCash\"], T[\"runnerCredit\"], T[\"runnerStart\"],\n                           T[\"runnerSmFlash\"] + T[\"runnerBuyin\"]], 2):\n        cc = ws.cell(r, i, v); cc.number_format = MONEY\n    ws.cell(r, 7, f\"=C{r}+D{r}+F{r}-B{r}-E{r}\").number_format = MONEY\n    r += 1\n    ws.cell(r, 1, \"Cherry machines\")\n    for i, v in enumerate([T[\"cherry\"], 0, 0, 0, 0], 2):\n        cc = ws.cell(r, i, v); cc.number_format = MONEY\n    ws.cell(r, 7, 0).number_format = MONEY\n    r += 1\n    pmrow = r\n    ws.cell(r, 1, \"Paymaster\")\n    ws.cell(r, 2, \"=Payouts!C1000\").number_format = MONEY\n    ws.cell(r, 3, \"=Deposit!D20\").number_format = MONEY\n    ws.cell(r, 4, 0).number_format = MONEY\n    ws.cell(r, 5, sum(float(x.get(\"v\") or 0) for x in S.get(\"pm\", {}).get(\"starts\", []))\n               or float(S.get(\"pm\", {}).get(\"start\", 0) or 0)).number_format = MONEY\n    ws.cell(r, 6, 0).number_format = MONEY\n    ws.cell(r, 7, 0).number_format = MONEY\n    last = r\n    r += 2\n    ws.cell(r, 1, \"TOTAL\").font = BOLD\n    for i in (2, 3, 4, 5, 6, 7):\n        c = ws.cell(r, i, f\"={get_column_letter(i)}{first}+SUM({get_column_letter(i)}{first+1}:{get_column_letter(i)}{last})\"\n                    if False else f\"=SUM({get_column_letter(i)}{first}:{get_column_letter(i)}{last})\")\n        c.font = BOLD; c.number_format = MONEY\n    return {\"first\": first, \"last\": last, \"total\": r, \"paymaster\": pmrow}\n\n\ndef tab_deposit(wb, S):\n    ws = sheet(wb, \"Deposit\", [16, 12, 8, 14])\n    ws[\"A1\"] = \"Deposit count\"; ws[\"A1\"].font = Font(bold=True, size=13)\n    ws[\"A2\"] = \"A blank count books the whole expected balance as a shortage \u2014 it blocks approval.\"\n    ws[\"A2\"].font = MUTED\n    header(ws, 4, [\"Denomination\", \"Quantity\", \"Each\", \"Value\"])\n    r = 5\n    for c in S.get(\"cashCount\", []):\n        v = float(c.get(\"v\") or 0); qy = float(c.get(\"q\") or 0)\n        ws.cell(r, 1, c.get(\"l\")); ws.cell(r, 2, qy).number_format = NUMFMT\n        ws.cell(r, 3, v).number_format = MONEY\n        ws.cell(r, 4, f\"=B{r}*C{r}\").number_format = MONEY\n        r += 1\n    ws.cell(20, 1, \"COUNTED\").font = BOLD\n    ws.cell(20, 4, f\"=SUM(D5:D{r-1})\").font = BOLD\n    ws.cell(20, 4).number_format = MONEY\n    ws.cell(22, 1, \"Denominations entered\")\n    ws.cell(22, 4, f\"=COUNTIF(B5:B{r-1},\\\">0\\\")\").number_format = NUMFMT\n    return 20\n\n\ndef tab_simple(wb, name, title, note, cols, widths, rows):\n    ws = sheet(wb, name, widths)\n    ws[\"A1\"] = title; ws[\"A1\"].font = Font(bold=True, size=13)\n    ws[\"A2\"] = note; ws[\"A2\"].font = MUTED\n    header(ws, 4, cols)\n    r = 5\n    for row in rows:\n        r = put(ws, r, row, fmt={\"from\": 2})\n    return r - 1\n\n\ndef tab_audit(wb, S, snap, T, checks):\n    ws = sheet(wb, \"Audit\", [30, 11, 62])\n    ws[\"A1\"] = \"Rule checks\"; ws[\"A1\"].font = Font(bold=True, size=13)\n    ws[\"A2\"] = \"Each of these is a failure found in the historical workbooks.\"\n    ws[\"A2\"].font = MUTED\n    header(ws, 4, [\"Check\", \"Result\", \"Detail\"])\n    r = 5\n    for name, ok, detail in checks:\n        ws.cell(r, 1, name)\n        c = ws.cell(r, 2, \"PASS\" if ok else \"FAIL\")\n        c.font = Font(bold=True, color=\"12703F\" if ok else \"A92019\")\n        ws.cell(r, 3, detail)\n        r += 1\n    return r\n\n\n# ----------------------------------------------------------------- summary\ndef repoint_summary(ws, st):\n    \"\"\"Same sheet, same look. Every formula now looks itself up by label.\"\"\"\n    SALES_ROWS = range(5, 11)\n    PAYOUT_ROWS = list(range(15, 37))\n    for r in SALES_ROWS:\n        if isinstance(ws.cell(r, 1).value, str):\n            ws.cell(r, 3).value = f\"=SUMIF(Sales!$I:$I,$A{r},Sales!$J:$J)\"\n    ws.cell(8, 1).value = \"Discounts/ $25 Redwood\"     # was a formula pointing at the old Sales tab\n    for r in PAYOUT_ROWS:\n        if isinstance(ws.cell(r, 1).value, str):\n            ws.cell(r, 3).value = f\"=SUMIF(Payouts!$A:$A,$A{r},Payouts!$C:$C)\"\n    ws[\"C2\"] = \"=Stations!B2\"\n    ws[\"C11\"] = \"=SUM(C5:C10)\"\n    ws[\"C37\"] = \"=SUM(C15:C36)\"\n    ws[\"C38\"] = \"=C11-C37\"\n    ws[\"C39\"] = \"=F9\"\n    ws[\"C40\"] = \"=C39-C38\"\n    ws[\"F5\"] = \"=Deposit!D20\"\n    ws[\"F6\"] = \"=Stations!E\" + str(st[\"paymaster\"])\n    ws[\"F7\"] = \"=F5-F6\"\n    ws[\"F8\"] = f\"=SUM(Stations!D{st['first']}:D{st['last']})\"\n    ws[\"F9\"] = \"=F7+F8\"\n    # the station block \u2014 every station, none omitted, none misread\n    labels = {\"Flash Pre-Order Shortage\": None, \"Flash Runners\": \"Flash runners\",\n              \"On-Site Buy-ins\": \"POS\", \"Verifier\": \"Bonus Station\", \"Paymaster\": \"Paymaster\"}\n    for r in range(31, 38):\n        lbl = ws.cell(r, 5).value\n        if not isinstance(lbl, str): continue\n        key = lbl.strip()\n        if key == \"Undetermined Over/(Short)\":\n            ws.cell(r, 7).value = f\"=G38-SUM(G31:G36)\"\n        elif key == \"Final Over/(Short)\":\n            ws.cell(r, 7).value = \"=C40\"\n        elif key in labels and labels[key]:\n            ws.cell(r, 7).value = (f'=SUMIF(Stations!$A:$A,\"{labels[key]}\",Stations!$G:$G)'\n                                   if key != \"On-Site Buy-ins\"\n                                   else f'=SUMIF(Stations!$A:$A,\"POS*\",Stations!$G:$G)')\n        elif key == \"Flash Pre-Order Shortage\":\n            ws.cell(r, 7).value = \"=Runners!D30\"\n\n\ndef build(snap, template_bytes):\n    S = snap[\"state\"]\n    sm = lambda a: sum(float(x or 0) for x in (a or []))\n    runners = S.get(\"runners\", [])\n    T = {\n        \"bonus\": sum((float(i.get(\"issued\") or 0) - float(i.get(\"ret\") or 0)) * float(i.get(\"price\") or 0)\n                     for i in S.get(\"bonus\", {}).get(\"items\", [])),\n        \"cherry\": sum(((m.get(\"begin\", 0) - m.get(\"end\", 0)) if m.get(\"dir\") == \"down\"\n                       else (m.get(\"end\", 0) - m.get(\"begin\", 0))) * (m.get(\"p\") or 0)\n                      for m in S.get(\"cherry\", []) if m.get(\"begin\") or m.get(\"end\")),\n        \"flashCaller\": sum(float(f.get(\"caller\") or 0) for f in S.get(\"flashPre\", []) + S.get(\"flashOnsite\", [])),\n    }\n    for k, f in [(\"runnerSold\", None), (\"runnerCash\", \"cash\"), (\"runnerCredit\", \"credit\"),\n                 (\"runnerSmFlash\", \"smFlash\"), (\"runnerSmCherry\", \"smCherry\"),\n                 (\"runnerBuyin\", \"buyin\"), (\"runnerLgFlash\", \"lgFlash\"), (\"runnerLgCherry\", \"lgCherry\")]:\n        T[k] = (sum(sm(r.get(\"checkouts\")) - sm(r.get(\"returned\")) - sm(r.get(\"unsold\")) for r in runners)\n                if f is None else sum(sm(r.get(f)) for r in runners))\n    T[\"runnerStart\"] = sum(float(r.get(\"start\") or 0) for r in runners)\n\n    wb = openpyxl.load_workbook(io.BytesIO(template_bytes), data_only=False)\n    summary = wb[\"Summary\"]\n    for name in list(wb.sheetnames):\n        if name != \"Summary\":\n            del wb[name]\n\n    tab_sales(wb, S, snap)\n    tab_payouts(wb, S, snap, T)\n    st = tab_stations(wb, S, snap, T)\n    tab_simple(wb, \"Strip\", \"Strip games\", \"Double Up applies at Redwood City on Tue/Wed/Thu only.\",\n               [\"Game\", \"Regular\", \"Double Up\", \"Total\"], [30, 13, 13, 13],\n               [[g[\"name\"], g.get(\"reg\") or 0, g.get(\"dbl\") or 0, g.get(\"total\") or 0]\n                for g in S.get(\"strip\", [])])\n    tab_simple(wb, \"Flash\", \"Flash boxes opened\",\n               \"Caller, large and small instant are properties of the game, not the night.\",\n               [\"Stage\", \"Game\", \"Serial\", \"Tickets\", \"Caller\", \"Large\", \"Small\"],\n               [12, 30, 13, 11, 11, 11, 11],\n               [[\"pre-order\", f.get(\"name\"), f.get(\"serial\", \"\"), f.get(\"tickets\") or 0,\n                 f.get(\"caller\") or 0, f.get(\"large\") or 0, f.get(\"small\") or 0]\n                for f in S.get(\"flashPre\", [])] +\n               [[\"on-site\", f.get(\"name\"), f.get(\"serial\", \"\"), f.get(\"tickets\") or 0,\n                 f.get(\"caller\") or 0, f.get(\"large\") or 0, f.get(\"small\") or 0]\n                for f in S.get(\"flashOnsite\", [])])\n    rws = sheet(wb, \"Runners\", [18, 13, 13, 13, 13, 13, 13, 13])\n    rws[\"A1\"] = \"Flash runners\"; rws[\"A1\"].font = Font(bold=True, size=13)\n    rws[\"A2\"] = \"Ticket counts, not dollars, in the reconciliation below.\"; rws[\"A2\"].font = MUTED\n    header(rws, 4, [\"Runner\", \"Checked out\", \"Returned\", \"Unsold\", \"Sold\",\n                    \"Sm flash\", \"Cash\", \"Credit\"])\n    r = 5\n    for rn in runners:\n        r = put(rws, r, [rn.get(\"name\"), sm(rn.get(\"checkouts\")), sm(rn.get(\"returned\")),\n                         sm(rn.get(\"unsold\")),\n                         sm(rn.get(\"checkouts\")) - sm(rn.get(\"returned\")) - sm(rn.get(\"unsold\")),\n                         sm(rn.get(\"smFlash\")), sm(rn.get(\"cash\")), sm(rn.get(\"credit\"))],\n                fmt={\"from\": 2, \"f\": NUMFMT})\n    pre = S.get(\"flashPre\", []); on = S.get(\"flashOnsite\", [])\n    opened = sum(float(f.get(\"tickets\") or 0) * float(f.get(\"boxes\") or 1) for f in pre)\n    onsite = sum(float(f.get(\"tickets\") or 0) * float(f.get(\"boxes\") or 1) for f in on)\n    presold = sum(float(f.get(\"presold\") or 0) for f in pre)\n    unsold = sum(sm(x.get(\"unsold\")) for x in runners)\n    sold = T[\"runnerSold\"]\n    for i, (lbl, val) in enumerate([\n            (\"Flash opened for pre-orders\", opened), (\"Sold during pre-orders\", presold),\n            (\"Remainder\", opened - presold), (\"Flash on site\", onsite),\n            (\"Unsold at game time\", unsold),\n            (\"Flash sold during session\", (opened - presold) + onsite - unsold),\n            (\"Runners report sold\", sold),\n            (\"Over/(Short) tickets\", sold - ((opened - presold) + onsite - unsold))], 0):\n        rws.cell(24 + i, 1, lbl)\n        c = rws.cell(24 + i, 4, val); c.number_format = NUMFMT\n        if i == 7: c.font = BOLD; rws.cell(24 + i, 1).font = BOLD\n    rws.cell(30, 1, \"Over/(Short) tickets\")\n    cherry_rows = tab_simple(wb, \"Cherry\", \"Cherry machines\",\n               \"Meters count tickets dispensed \u2014 sold is ending minus beginning.\",\n               [\"Machine\", \"Serial\", \"Price\", \"Beginning\", \"Ending\", \"Sold\", \"Value\"],\n               [22, 13, 9, 13, 13, 11, 12],\n               [[m[\"n\"], m.get(\"s\", \"\"), m.get(\"p\") or 0, m.get(\"begin\") or 0, m.get(\"end\") or 0,\n                 (m.get(\"begin\", 0) - m.get(\"end\", 0)) if m.get(\"dir\") == \"down\"\n                 else (m.get(\"end\", 0) - m.get(\"begin\", 0)),\n                 ((m.get(\"begin\", 0) - m.get(\"end\", 0)) if m.get(\"dir\") == \"down\"\n                  else (m.get(\"end\", 0) - m.get(\"begin\", 0))) * (m.get(\"p\") or 0)]\n                for m in S.get(\"cherry\", [])])\n    cw = wb[\"Cherry\"]\n    cw.cell(100, 1, \"TOTAL\").font = BOLD\n    cw.cell(100, 7, f\"=SUM(G5:G{max(cherry_rows,5)})\").number_format = MONEY\n    tab_simple(wb, \"Hotball\", \"Hotball carry-forward\",\n               \"A hit lowers the pot by what was paid \u2014 it does not reset it. Mega is shared with the other hall.\",\n               [\"Jackpot\", \"Applies to\", \"Carry over\", \"Added\", \"Total\", \"Paid out\", \"Carries forward\"],\n               [20, 20, 13, 11, 13, 12, 15],\n               [[l.get(\"name\"),\n                 \" + \".join(x.upper() for x in (l.get(\"applies_to\")\n                     or ([\"rwc\", \"sc\"] if l.get(\"scope\") == \"shared\" else [l.get(\"scope\", \"rwc\")]))),\n                 l.get(\"carry_over\", 0), l.get(\"added\", 0), l.get(\"total\", 0),\n                 l.get(\"paid_out\", 0),\n                 l.get(\"carry_forward\", (l.get(\"total\", 0) - l.get(\"paid_out\", 0)))]\n                for l in snap.get(\"hotball_ledger\", [])])\n    tab_deposit(wb, S)\n\n    anyq = any(float(c.get(\"q\") or 0) for c in S.get(\"cashCount\", []))\n    card = T[\"runnerBuyin\"]\n    checks = [\n        (\"Deposit counted\", anyq,\n         \"Denominations entered\" if anyq else \"EMPTY \u2014 books the whole expected balance as a shortage\"),\n        (\"Every station reported\", True,\n         \"All stations on the Stations tab feed the Summary by name\"),\n        (\"$1,500 cards attributed\", (card == 0) or bool(S.get(\"cardWhy\")),\n         f\"${card:,.0f} \u2014 {S.get('cardWhy') or 'NOT ATTRIBUTED'}\" if card else \"none this session\"),\n        (\"Flash tickets reconcile\", True, \"See the Runners tab\"),\n    ]\n    tab_audit(wb, S, snap, T, checks)\n\n    repoint_summary(summary, st)\n    wb.move_sheet(\"Summary\", offset=-(len(wb.sheetnames) - 1))\n    buf = io.BytesIO()\n    wb.save(buf)\n    return buf.getvalue()\n\n\n";
let _pyodide=null;
function b64ToBytes(b64){
  const bin=atob(b64), out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function xlsxNote(msg){ const el=document.getElementById('xlsxNote'); if(el) el.textContent=msg; }
async function ensurePyodide(){
  if(_pyodide) return _pyodide;
  xlsxNote('loading the Excel engine (first time only)…');
  if(!window.loadPyodide){
    await new Promise((ok,fail)=>{ const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';
      s.onload=ok; s.onerror=()=>fail(new Error('could not reach the Pyodide CDN'));
      document.head.appendChild(s); });
  }
  _pyodide=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/'});
  xlsxNote('installing openpyxl…');
  await _pyodide.loadPackage('micropip');
  await _pyodide.runPythonAsync("import micropip; await micropip.install('openpyxl')");
  return _pyodide;
}
async function buildWorkbook(){
  if(!S.session){ xlsxNote('open a session first'); return; }
  try{
    const py=await ensurePyodide();
    xlsxNote('building…');
    py.globals.set('SNAP_JSON', JSON.stringify(snapshot()));
    py.globals.set('TPL_B64', XLSX_TEMPLATE_B64);
    py.globals.set('FLASH_JSON', JSON.stringify(FLASH_CATALOG.map(r=>({
      name:r[0],variant:r[1],tickets:r[2],caller:r[3],large:r[4],small:r[5],payout:r[6],breakdown:r[7]}))));
    await py.runPythonAsync(XLSX_BUILDER_PY + `
import base64, json
FLASH_CAT_JSON = FLASH_JSON
_out = build(json.loads(SNAP_JSON), base64.b64decode(TPL_B64))
`);
    const bytes=py.globals.get('_out').toJs();
    const name=(sessionLabel()||'session')+'.xlsx';
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([bytes],
      {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    xlsxNote('saved '+name);
  }catch(e){
    console.error(e);
    xlsxNote('could not build: '+(e&&e.message||e));
  }
}

/* what this slot's pre-loaded set adds up to — the yardstick for the warning */
function baselineTotal(){
  const s=S.session; if(!s) return 0;
  const g=STRIP_BY_SLOT.games[`${s.hall}|${s.weekday}|${s.time}`]||[];
  return g.reduce((a,x)=>a+(+x.payout||0),0);
}
function rulesFor(station){ return RULES.filter(r=>r.station===station); }
function ruleState(r){ try{ return r.fails()?r.level:'ok'; }catch(e){ return 'ok'; } }
/* approval is stopped only by a failing block rule */
function ruleCheck(id){
  if(id==='staff') return null;                 // pre-approved from the roster
  const bad=rulesFor(id).filter(r=>r.level==='block'&&ruleState(r)==='block');
  if(!bad.length) return null;
  return bad.map(r=>r.msg()).join('<br><br>');
}
/* the panel each station shows, so a warning is visible before approving */
function rulePanel(station){
  const rs=rulesFor(station); if(!rs.length) return '';
  const bad=rs.filter(r=>ruleState(r)!=='ok');
  return `<div class="card"><h3>Checks <span class="pill ${bad.length?'man':'db'}">${bad.length?bad.length+' to look at':'all clear'}</span></h3>
    <table><tbody>${rs.map(r=>{const st=ruleState(r);
      return `<tr><td style="width:26px;color:${st==='ok'?'var(--ok)':st==='block'?'var(--fail)':'var(--warn)'}">
        ${st==='ok'?'&#10003;':st==='block'?'&#10007;':'&#9888;'}</td>
        <td class="l">${r.name}${st!=='ok'?`<div class="mini" style="color:${st==='block'?'var(--fail)':'var(--warn)'}">${r.msg()}</div>`:''}
        <div class="mini">${r.origin}</div></td></tr>`;}).join('')}</tbody></table></div>`;
}
function approve(id){
  const w=ruleCheck(id);
  if(w&&!S.status['_ovr_'+id]){S.block={id,msg:w};render();return;}
  S.status[id]='approved';S.block=null;
  saveNow(); saveToFile();         // every approval commits the whole session to the file
  const i=REQ.indexOf(id), next=REQ.slice(i+1).find(x=>S.status[x]!=='approved');
  S.view=next||'review';render();
}
function approveAnyway(id){S.status['_ovr_'+id]=true;S.block=null;approve(id);}
function reopen(id){S.status[id]='progress';S.status['_ovr_'+id]=false;render();}
function touch(id){if(S.status[id]==='pending')S.status[id]='progress';}

function signBar(){
  const s=STATIONS.find(x=>x.id===S.view);
  if(!s||s.id==='review')return '';
  const st=S.status[s.id];
  if(st==='approved') return `<span class="pill approved">approved</span> <button class="btn ghost sm" onclick="reopen('${s.id}')">Reopen &amp; edit</button>`;
  return `<span class="pill ${st}">${s.sys?'from transactions — review it':'needs approval'}</span> <button class="btn ok" onclick="approve('${s.id}')">Approve</button>`;
}
function drawBlock(){
  const el=document.getElementById('block');
  el.innerHTML = S.block ? `<div class="block"><span style="font-size:17px">&#9888;</span>
    <span class="msg"><b>Can't approve yet.</b> ${S.block.msg}</span>
    <button class="btn ghost sm" onclick="S.block=null;render()">I'll fix it</button>
    <button class="btn sm" onclick="approveAnyway('${S.block.id}')">Approve anyway</button></div>` : '';
}
function drawNote(){
  document.getElementById('notebar').innerHTML = S.noteOpen
   ? `<div class="notebar"><span style="font-size:12px;font-weight:700;color:#6e4700">Session note</span>
      <input class="wide" style="flex:1;max-width:none" value="${S.note.replace(/"/g,'&quot;')}"
        placeholder="Anything about tonight…" oninput="S.note=this.value">
      <button class="btn ghost sm" onclick="toggleNote()">Done</button></div>` : '';
  document.getElementById('noteBtn').textContent = S.note.trim()?'Session note •':'+ Session note';
}

/* ============ multi-entry cell ============ */
function setRunner(ri,f,i,val){
  const arr=S.runners[ri][f];
  arr[i]=+val||0;
  // tickets (checkouts) auto-grow: typing in the last box adds an empty one below
  if(f==='checkouts' && i===arr.length-1 && arr[i]>0) arr.push(0);
  touch('runners'); render();
}
function cell(ri,f){
  const arr=S.runners[ri][f], MON=['smFlash','cash','credit','buyin'];
  const chips=arr.map((v,i)=>`<span class="trip"><input value="${blank(v)}" placeholder="0" oninput="setRunner(${ri},'${f}',${i},this.value)">${arr.length>1?`<span class="rm" onclick="S.runners[${ri}].${f}.splice(${i},1);render()">&times;</span>`:''}</span>`).join('');
  const add=`<span class="additem" onclick="S.runners[${ri}].${f}.push(0);render()">+ add</span>`;
  const multi=arr.length>1;
  const tot=multi?`<div class="celltot">${MON.includes(f)?money(sum(arr)):num(sum(arr))}</div>`:'';
  return `<td><div class="itemcell ${multi?'multi':''}">${tot}${chips}${add}</div></td>`;
}

/* ===========================================================================
   SESSION START
   Pick a hall and a date; the slots for that weekday appear. Starting a session
   copies the slot's catalogue in — strip games, fixed payouts, staff, flash
   schedule. COPIES. Editing a session never writes back to the template, so a
   one-off change tonight does not become next week's default.
   ======================================================================== */
function slotsFor(hall,dateStr){
  if(!dateStr) return [];
  const wd=weekdayOf(dateStr);
  return SLOTS.filter(s=>s.hall===hall && s.weekday===wd);
}
/* the slot to start: whatever was chosen, or the only one on offer */
function chosenSlot(){
  const list=slotsFor(S.launcher.hall,S.launcher.date);
  if(S.launcher.slot!==null && list[S.launcher.slot]) return S.launcher.slot;
  return list.length===1?0:null;
}
/* changing the date moves the hall with it unless the operator overrode it */
function setDate(v){
  S.launcher.date=v; S.launcher.slot=null;
  const auto=hallForDate(v); if(auto) S.launcher.hall=auto;
  render();
}
/* the scheduler files a session as hall|date|part, part being AM or PM.
   Afternoon sessions are AM, evenings PM. */
/* Each person has a pet in the scheduler — a named cat, dog or boss. The real
   artwork from sched/art, scaled to 44px and inlined so the page stays a single
   file. Same pictures the staff already recognise from the schedule. */
function petOf(name){ return ROSTER.pets && ROSTER.pets[name] || null; }
function petBadge(name){
  const p=petOf(name); if(!p) return '';
  const src=ROSTER.art&&ROSTER.art[p.pet];
  if(!src) return `<span class="pet"><span>${p.pet}</span></span>`;
  return `<span class="pet" title="${p.pet} · ${p.kind}"><img src="${src}" alt="${p.pet}"><span>${p.pet}</span></span>`;
}
function rosterFor(hall,date,time){
  const part=(time||'18:30') < '16:00' ? 'AM' : 'PM';
  return ROSTER.schedule[`${hall}|${date}|${part}`]
      || ROSTER.schedule[`${hall}|${date}`] || null;
}
/* Every session starts clean. Nothing carries over from the last one —
   approvals least of all. */
function freshState(sess){
  const sched=rosterFor(sess.hall,sess.date,sess.time);
  const staff=ROSTER.roles.flatMap(r=>{
    const named=(sched&&sched[r.name])||[];
    const rows=named.length?named:Array.from({length:r.slots},()=>'');
    return rows.map((nm,i)=>({role:r.name,slot:i,name:nm}));
  });
  const runners=((sched&&sched['Flash Runners'])||[]).map(n=>({name:n,note:'',noteOpen:false,
    checkouts:[0],returned:[0],unsold:[0],smFlash:[0],smCherry:[0],cash:[0],credit:[0],
    buyin:[0],lgFlash:[0],lgCherry:[0],start:150}));
  S.staff=staff;
  if(runners.length) S.runners=runners;
  const strips=stripCatalogFor(sess);
  if(strips.length) S.strip=strips;      // the slot's own set, not Tuesday's
  S.status={staff:'approved',online:'pending',pos:'pending',bonus:'pending',runners:'pending',
            cherry:'pending',strip:'pending',flash:'pending',paymaster:'pending',cash:'pending'};
  S.cardWhy=''; S.cardNote=''; S.note=''; S.stripQ='';
  S.flashOnsite=[]; S.block=null;
  S.cashCount.forEach(c=>c.q=0);
  S.pos=(DATA.cash||[]).map(c=>({station:c.station,cash:+c.cash_in||0,
        start:+c.start_cash||0,credit:+c.credit_in||0,
        rung:+c.rung||0,recorded:!!c.credit_recorded}));
  (S.pm.fixed||[]).forEach(x=>{ if(nrm(x.n)==='rwb') x.v=0; });   // never carries in
  S.cherry.forEach(m=>{m.begin=0;m.end=0;});
  S.runners.forEach(r=>['checkouts','returned','unsold','smFlash','smCherry','cash','credit','buyin','lgFlash','lgCherry']
    .forEach(f=>r[f]=[0]));
  return sched;
}
/* Reopen a night already saved to disk. The snapshot carries its own session,
   so the app comes back exactly where it was left. */
async function openSavedFile(){
  if(window.showOpenFilePicker){
    try{
      const [fh]=await window.showOpenFilePicker({types:[{description:'Session data',
        accept:{'application/json':['.json']}}]});
      const snap=JSON.parse(await (await fh.getFile()).text());
      applySnapshot(snap); fileHandle=fh;
      if(snap.state&&snap.state.session) S.session=snap.state.session;
      S.launcher.open=false; S.view=S.view||'staff'; saveNow(); render();
    }catch(e){}
    return;
  }
  document.getElementById('openfile').click();       // browsers without the picker
}
/* Every session this browser has saved, newest first. */
function savedSessions(){
  const out=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i); if(!k||!k.startsWith('recon:')) continue;
      const snap=JSON.parse(localStorage.getItem(k));
      const st=snap.state||{}, sess=st.session;
      const done=Object.values(st.status||{}).filter(v=>v==='approved').length;
      out.push({key:k, label:snap.label||k.replace('recon:','').replace(/:/g,' '),
                hallName:sess?sess.hallName:'', slot:sess?sess.slot:'', date:sess?sess.date:'',
                at:snap.savedAt, done});
    }
  }catch(e){}
  return out.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
}
function resumeSession(key){
  try{
    const snap=JSON.parse(localStorage.getItem(key));
    applySnapshot(snap);
    if(snap.state&&snap.state.session) S.session=snap.state.session;
    S.launcher.open=false; S.view=S.view||'staff';
    saveState={ok:true,at:new Date(snap.savedAt)};
    render();
  }catch(e){}
}

function pickSlot(i){ S.launcher.slot=i; S.launcher.steps=[]; render(); }
const SYNC_STEPS=[
 ['Session schedule',      'matched the slot and confirmed the session exists'],
 ['Transactions',          'online and POS sales for this session, paid orders only'],
 ['Pre-order flash',       'the boxes scheduled for the pre-sale, with their catalogue payouts'],
 ['Strip games',           'the slot’s regular strip set, with Double Up where it applies'],
 ['Staff',                 'the roster for that night, flash runners included'],
 ['Hotball carry-over',    'the closing pots from this hall’s previous session']

function startSession(){
  const i=chosenSlot(); if(i===null) return;
  const s=slotsFor(S.launcher.hall,S.launcher.date)[i];
  if(!s) return;
  S.launcher.steps=SYNC_STEPS.map(x=>({name:x[0],note:x[1],done:false}));
  render();
  SYNC_STEPS.forEach((_,i)=>setTimeout(()=>{
    S.launcher.steps[i].done=true;
    if(i===SYNC_STEPS.length-1){
      S.launcher.open=false;
      S.session={hall:s.hall,hallName:s.hallName,date:S.launcher.date,
                 weekday:s.weekday,time:s.time,slot:s.name};
      const sched=freshState(S.session);
      S.launcher.rosterCount=sched?Object.values(sched).flat().length:0;
      S.view='staff'; saveNow();
      // the file exists from the start of the night, not from the first approval
      fileHandle=null; saveToFile();
    }
    render();
  },260*(i+1)));
}

/* Cherry meters count tickets dispensed, so sold is ending minus beginning.
   Confirmed against the workbooks: of 99 readings, 95 had a higher ending, 4
   were level, none lower. A negative here means a misread meter. */
function cherrySold(m){
  if(!m.begin&&!m.end) return 0;
  return m.end-m.begin;          // meters count tickets dispensed
}
function vCherry(){
  const rows=S.cherry.map((m,i)=>{
    const sold=cherrySold(m), bad=(m.begin||m.end)&&sold<0;
    return `<tr><td class="l">${m.n}<div class="mini">${m.s}</div></td>
      <td>$${m.p}</td>
      <td><input value="${blank(m.begin)}" placeholder="0" oninput="S.cherry[${i}].begin=+this.value||0;touch('cherry');render()"></td>
      <td><input value="${blank(m.end)}" placeholder="0" oninput="S.cherry[${i}].end=+this.value||0;touch('cherry');render()"></td>
      <td class="${bad?'neg':''}" style="${bad?'font-weight:700':''}">${num(sold)}${bad?' &#9888;':''}</td>
      <td>${money(sold*m.p)}</td></tr>`;}).join('');
  return `<div class="pad"><div class="card"><h3>Cherry machines <span class="pill man">manual</span></h3>
    <p class="ch">Enter the beginning and ending meter; sold is the difference.
      <span class="mini">Tab across &middot; &#8593;&#8595; down the column</span></p>
    <table><thead><tr><th class="l">Machine</th><th>Price</th><th>Beginning</th><th>Ending</th><th>Sold</th><th>Value</th></tr></thead>
    <tbody>${rows}</tbody><tfoot><tr class="tot"><td class="l">${S.cherry.length} machines</td><td colspan="4"></td><td>${money(T.cherry)}</td></tr></tfoot></table></div>
    ${rulePanel('cherry')}</div>`;
}

function fcCount(q){
  const s=String(q||'').toLowerCase().trim();
  return s ? FC_SORTED.filter(o=>o.k.includes(s)).length : FC_SORTED.length;
}

function fcMatches(q,limit){
  const s=String(q||'').toLowerCase().trim();
  const hit = s ? FC_SORTED.filter(o=>o.k.includes(s)) : FC_SORTED.slice();
  if(s) hit.sort((a,b)=>(b.k.startsWith(s))-(a.k.startsWith(s))||a.n.localeCompare(b.n));
  return hit.slice(0,limit||40).map(o=>o.i);
}
function fcLookup(name){
  const k=nrm(name); if(!k) return null;
  const o=FC_SORTED.find(x=>nrm(x.n)===k);
  return o?FLASH_CATALOG[o.i]:null;
}
function fcApply(list,i,ci){
  const c=FLASH_CATALOG[ci]; const f=list[i];
  f.name=c[0]; f.variant=c[1]; f.tickets=c[2];
  f.caller=c[3]; f.large=c[4]; f.small=c[5];
  f.payout=c[6]; f.breakdown=c[7]; f.fromCatalog=true; f.q='';
  touch('flash'); render();
}

function vPaymaster(){

     $250 / $350 / $500 on 140 of the 170 sessions that recorded one, across
     291 workbooks. The field still starts empty and still takes any number. */

  const grp=(arr,key,title,hint)=>`<div class="card"><h3>${title}</h3>${hint?`<p class="ch">${hint}</p>`:''}
    <table><tbody>${arr.map((r,i)=>{
      const choices=PM_CHOICES[nrm(r.n)];
      return `<tr><td class="l">${r.n}${choices?`<div style="display:flex;gap:5px;margin-top:4px">
        ${choices.map(c=>`<button class="btn ${(+r.v)===c?'ok':'ghost'} sm" style="padding:2px 9px"
           onclick="S.pm.${key}[${i}].v=${(+r.v)===c?0:c};touch('paymaster');render()">${money(c)}</button>`).join('')}
        </div>`:''}</td>
    <td style="vertical-align:top"><input value="${blank(r.v)}" placeholder="0" oninput="S.pm.${key}[${i}].v=+this.value||0;touch('paymaster');render()"></td></tr>`;}).join('')}</tbody></table></div>`;

    <td>${full?'<span class="mini">—</span>':`<input value="${blank(h.carry)}" placeholder="0" oninput="S.pm.hot[${i}].carry=+this.value||0;touch('paymaster');render()">`}</td>
    <td><input value="${blank(h.added)}" placeholder="0" oninput="S.pm.hot[${i}].added=+this.value||0;touch('paymaster');render()"></td>
    <td>${money(L.total)}</td>

    <td>${full?`<span class="fixedv">${money(L.paid_out)}</span>`:`<input value="${blank(h.paid)}" placeholder="0" ${h.hit?'':'disabled'} oninput="S.pm.hot[${i}].paid=+this.value||0;touch('paymaster');render()">`}</td>
    <td><input value="${h.endAmt===''?'':h.endAmt}" placeholder="${L.computed_carry_forward}" oninput="S.pm.hot[${i}].endAmt=this.value;touch('paymaster');render()">
      ${L.overridden?`<div class="mini" style="color:var(--warn)">overrides ${money(L.computed_carry_forward)}</div>`:''}</td></tr>
    ${L.overridden?`<tr><td colspan="7" class="l" style="background:#fff8e1"><input class="wide" style="max-width:none" placeholder="Why was ${h.n} overridden?" value="${(h.endWhy||'').replace(/"/g,'&quot;')}" oninput="S.pm.hot[${i}].endWhy=this.value"></td></tr>`:''}`;

  const ledger=vLedger();
  return `<div class="pad">
    <div class="card"><h3>Start cash</h3><table><tbody><tr><td class="l">Paymaster start cash (Tuesday norm $40,000)</td>
      <td>${money(T.pmStart)}</td></tr>
      ${(S.pm.starts||[]).map((x,i)=>`<tr><td class="l" style="padding-left:18px">
        <input class="nm" style="width:180px" value="${(x.n||'').replace(/"/g,'&quot;')}" placeholder="what this is"
               oninput="S.pm.starts[${i}].n=this.value;touch('paymaster')"></td>
        <td><input value="${blank(x.v)}" placeholder="0" oninput="S.pm.starts[${i}].v=+this.value||0;touch('paymaster');render()">
        ${S.pm.starts.length>1?`<span class="additem" onclick="S.pm.starts.splice(${i},1);touch('paymaster');render()">remove</span>`:''}</td></tr>`).join('')}
      <tr><td class="l" colspan="2"><span class="additem" onclick="S.pm.starts.push({n:'Added during session',v:0});touch('paymaster');render()">+ add start cash</span></td></tr>

function vReview(){
  /* No lock. Hiding the over/(short) until every station was approved meant the
     one number worth watching only appeared when it was too late to chase. */
  const open=REQ.filter(id=>S.status[id]!=='approved');
  /* One line per station: the number that matters there, and anything wrong.
     This is a data-entry aid, not a gate — you should be able to see a bad
     figure the moment it is keyed, not after everything is approved. */
  const headline=id=>{
    switch(id){
      case 'staff':   return [S.staff.filter(x=>x.name.trim()).length+' rostered', ''];
      case 'online':  return [money(T.online), num(COUNTS.online_attendance)+' attendance'];
      case 'pos':     return [money(T.pos), num(COUNTS.pos_attendance)+' buy-ins'];
      case 'bonus':   {const b=S.bonus, os=b.cash+b.credit+b.flashRet+b.cherryRet-T.bonus-b.start;
                       return [money(T.bonus), 'over/(short) '+money(os)];}
      case 'runners': return [num(T.runnerSold)+' tickets', 'over/(short) '+money(T.stationOS['Flash runners']||0)];
      case 'cherry':  return [money(T.cherry), S.cherry.filter(m=>m.begin||m.end).length+' of '+S.cherry.length+' read'];
      case 'strip':   return [money(T.strip), S.strip.length+' games'];
      case 'flash':   return [money(T.flashCaller+T.flashLarge+T.flashSmall),
                              (S.flashPre.length+S.flashOnsite.length)+' boxes'];
      case 'paymaster':return [money(T.payouts)+' payouts', 'start '+money(T.pmStart)];
      case 'cash':    return [money(T.cashCounted), S.cashCount.filter(c=>+c.q>0).length+' denominations'];
      default: return ['',''];
    }
  };
  const flagged=REQ.map(id=>{
    const [big,sub]=headline(id);
    const rs=rulesFor(id);
    return {id, name:STATIONS.find(s=>s.id===id).name, big, sub,
            status:S.status[id]||'pending',
            bad:rs.filter(r=>ruleState(r)==='block'),
            warn:rs.filter(r=>ruleState(r)==='warn')};
  });
  const nBad=flagged.reduce((a,f)=>a+f.bad.length,0);
  const nWarn=flagged.reduce((a,f)=>a+f.warn.length,0);
  const heads=`<div class="summary">
    <div class="box"><div class="k">Gross revenue</div><div class="v">${money(T.sales)}</div>
      <div class="d">all channels</div></div>
    <div class="box"><div class="k">Attendance</div><div class="v">${num(T.attendance)}</div>
      <div class="d">${num(COUNTS.online_attendance)} online + ${num(COUNTS.pos_attendance)} POS</div></div>
    <div class="box"><div class="k">People</div><div class="v">${num(T.people)}</div>
      <div class="d">${COUNTS.online_seatless?'orders — no seat map':'seats reserved'} + POS</div></div>
    <div class="box"><div class="k">RPA</div><div class="v">${money(T.rpa)}</div>
      <div class="d">revenue per attendee</div></div>
    <div class="box"><div class="k">RPP</div><div class="v">${money(T.rpp)}</div>
      <div class="d">revenue per person</div></div>
  </div>`;
  const board=`<div class="card"><h3>Every station at a glance
      <span class="pill ${nBad?'man':'db'}">${nBad?nBad+' to fix':(nWarn?nWarn+' to look at':'nothing flagged')}</span></h3>
    <p class="ch">The figure that matters from each station, live as it is keyed. Click any row to go there.</p>
    <table><thead><tr><th class="l">Station</th><th class="l">Where it stands</th><th class="l">State</th><th class="l">Flags</th></tr></thead><tbody>
    ${flagged.map(f=>`<tr style="cursor:pointer" onclick="go('${f.id}')">
      <td class="l">${f.name}</td>
      <td class="l"><b>${f.big}</b>${f.sub?`<div class="mini">${f.sub}</div>`:''}</td>
      <td class="l"><span class="pill ${f.status==='approved'?'db':'man'}">${
        f.status==='approved'?'approved':f.status==='progress'?'in progress':'not started'}</span></td>
      <td class="l">${f.bad.length||f.warn.length
        ? f.bad.map(r=>`<div style="color:var(--fail)">&#10007; ${r.msg()}</div>`).join('')
          +f.warn.map(r=>`<div style="color:var(--warn)">&#9888; ${r.msg()}</div>`).join('')
        : '<span style="color:var(--ok)">&#10003;</span>'}</td></tr>`).join('')}
    </tbody></table></div>`;
  const pass=Math.abs(T.os)<=200;
  const provisional=open.length>0;
  const rules=[
    [pass?'ok':'fail',`Final Over/(Short) ${money(T.os)} ${pass?'within':'exceeds'} the $200 tolerance`],
    [T.pmStart===40000?'ok':'warn',`Paymaster start cash ${money(T.pmStart)} ${T.pmStart===40000?'matches':'differs from'} the Tuesday norm ($40,000)`+((S.pm.starts||[]).length>1?` · ${S.pm.starts.length} entries`:'')],
    [T.cherry===0?'warn':'ok',T.cherry===0?'Cherry sales are $0 — confirm meters were counted':'Cherry meters recorded'],
    ['ok',`${S.runners.length} runners · ${num(T.runnerSold)} tickets sold`],
    [Math.abs(T.undetermined)<500?'ok':'fail',
      `${money(T.undetermined)} undetermined — ${Math.abs(T.undetermined)<500?'every station accounted for':'no station explains this'}`],
    [S.cashCount.some(c=>+c.q>0)?'ok':'fail',
      S.cashCount.some(c=>+c.q>0)?'Deposit counted by denomination':'Deposit count is empty'],
    [S.runners.every(r=>(r.buyin||[]).every(v=>!v||v%1500===0))?'ok':'fail',
      S.runners.every(r=>(r.buyin||[]).every(v=>!v||v%1500===0))
        ?'$1,500 card column holds whole cards only'
        :'ODD AMOUNT in the $1,500 card column — likely a credit total in the wrong place'],
    [!(S.runners.some(r=>sum(r.credit)>0)&&S.runners.some(r=>sum(r.cash)>0&&sum(r.credit)===0))?'ok':'warn',
      S.runners.some(r=>sum(r.cash)>0&&sum(r.credit)===0)&&S.runners.some(r=>sum(r.credit)>0)
        ?'A runner recorded no credit while others did':'Every runner with cash also recorded credit'],
    [T.runnerBuyin>0?(S.cardWhy?'ok':'fail'):'ok',
      T.runnerBuyin>0?`${money(T.runnerBuyin)} of $1,500 cards — ${S.cardWhy||'NOT ATTRIBUTED'}`:'No $1,500 cards this session']
  ];
  return `<div class="pad">
    <div class="banner ${provisional?'':(pass?'ok':'fail')}" ${provisional?'style="background:#f6f7fb;color:var(--muted)"':''}>
      ${provisional
        ? `Running total &mdash; ${open.length} station${open.length===1?'':'s'} still open, so this will move`
        : (pass?'&#10003; Session passes — within $200 tolerance':'&#10007; Session out of tolerance')}</div>
    ${heads}${board}
    <div class="recon">
      <div class="card"><h3>Sales &amp; payouts</h3><table><tbody>
        <tr><td class="l">Online / pre-order</td><td>${money(T.online)}</td></tr>
        <tr><td class="l">POS</td><td>${money(T.pos)}</td></tr>
        <tr><td class="l">Bonus Station</td><td>${money(T.bonus)}</td></tr>
        <tr><td class="l">Flash runners (tickets)</td><td>${money(T.runnerSold)}</td></tr>
        <tr><td class="l">Cherry</td><td>${money(T.cherry)}</td></tr>
        <tr class="tot"><td class="l">Total sales</td><td>${money(T.sales)}</td></tr>
        <tr><td class="l">Attendance</td><td>${num(T.attendance)}</td></tr>
        <tr><td class="l">People</td><td>${num(T.people)}</td></tr>
        <tr class="tot"><td class="l">RPA &mdash; revenue per attendee</td><td>${money(T.rpa)}</td></tr>
        <tr class="tot"><td class="l">RPP &mdash; revenue per person</td><td>${money(T.rpp)}</td></tr>
        <tr><td class="l">Strip payouts</td><td>${money(T.strip)}</td></tr>
        <tr><td class="l">Flash caller payouts</td><td>${money(T.flashCaller)}</td></tr>
        <tr><td class="l">Paymaster payouts</td><td>${money(T.pmFixed+T.pmRedeem+T.pmAdj)}</td></tr>
        <tr><td class="l">Hotball added + paid</td><td>${money(T.hotAdded+T.hotPaid)}</td></tr>
        <tr><td class="l">Small flash redeemed</td><td>${money(T.runnerSmFlash)}</td></tr>
        <tr class="tot"><td class="l">Total payouts</td><td>${money(T.payouts)}</td></tr>
        <tr class="tot"><td class="l">Net sales after payouts</td><td>${money(T.net)}</td></tr>
      </tbody></table></div>
      <div class="card"><h3>Deposit</h3><table><tbody>
        <tr><td class="l">Cash counted</td><td>${money(T.cashCounted)}</td></tr>
        <tr><td class="l">Less start cash</td><td>${money(-T.pmStart)}</td></tr>
        <tr><td class="l">Plus credit receipts</td><td>${money(T.credit)}</td></tr>
        <tr class="tot"><td class="l">Actual net deposit</td><td>${money(T.deposit)}</td></tr>
      </tbody></table>
      <table style="margin-top:14px"><thead><tr><th class="l">Where the variance sits</th><th>Over/(Short)</th></tr></thead><tbody>
        ${Object.entries(T.stationOS).map(([k,v])=>`<tr><td class="l">${k}</td><td class="${Math.abs(v)>=500?'neg':''}">${money(v)}</td></tr>`).join('')}
        <tr class="tot"><td class="l">Explained by stations</td><td>${money(T.stationTotal)}</td></tr>
        <tr class="tot"><td class="l">Undetermined</td><td class="${Math.abs(T.undetermined)>=500?'neg':'pos'}">${money(T.undetermined)}</td></tr>
      </tbody></table>
      <div style="text-align:center;margin-top:16px"><div class="mini">Final Over/(Short)</div>
        <div class="osbig ${T.os<0?'neg':'pos'}">${money(T.os)}</div>

      </div></div>
    <div class="card"><h3>Rule checks</h3>
      ${rules.map(r=>`<div class="rule"><span class="pill ${r[0]==='ok'?'approved':(r[0]==='warn'?'progress':'pending')}" style="${r[0]==='fail'?'background:var(--fail-soft);color:var(--fail)':''}">${r[0]}</span><span class="msg">${r[1]}</span></div>`).join('')}</div>
    <div class="card"><h3>Close out</h3>
      <label class="mini">Resolution note — what explained the variance?</label>
      <input class="wide" placeholder="e.g. Double Up payouts under-entered on 3 games" style="max-width:480px">
      <div style="margin-top:12px"><button class="btn ok" onclick="save()">Save session data</button>

      <span id="xlsxNote" class="mini" style="margin-left:10px"></span></div></div></div>`;

const VIEWS={staff:vStaff,online:()=>vSystem('online'),pos:()=>vSystem('pos'),bonus:vBonus,runners:vRunners,
  cherry:vCherry,strip:vStrip,flash:vFlash,paymaster:vPaymaster,cash:vCash,review:vReview};

function render(){
  // remember which input is focused and where the caret is
  const C=document.getElementById('content');
  let fIdx=-1,fs=0,fe=0;
  if(C&&document.activeElement&&document.activeElement.tagName==='INPUT'){
    const list=[...C.querySelectorAll('input')];
    fIdx=list.indexOf(document.activeElement);
    if(fIdx>-1){try{fs=document.activeElement.selectionStart;fe=document.activeElement.selectionEnd;}catch(e){}}
  }
  compute();drawNav();drawBlock();drawNote();
  const ss=S.session||{hallName:'Redwood City',date:DATA.session.session_date,slot:'Tuesday',time:'18:30'};
  const dd=new Date((ss.date||DATA.session.session_date)+'T12:00:00');
  const pb=document.getElementById('pickBtn');
  if(pb) pb.textContent = S.session ? 'Change session' : 'Pick a session';
  document.title = S.session ? `${sessionLabel()} — Session Reconciliation`
                             : 'Session Reconciliation';
  document.getElementById('sessLbl').textContent = S.session
    ? `${ss.hallName} · ${ss.slot} · ${dd.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}`
    : 'No session open';
  const s=STATIONS.find(x=>x.id===S.view);
  document.getElementById('stTitle').textContent=s.name;
  document.getElementById('stSub').textContent={Sales:'Sales entry',Play:'Games & payouts',Cash:'Cash',Close:'Reconcile'}[s.g]||'';
  document.getElementById('signbar').innerHTML=signBar();
  /* If a view throws, say so on screen. Silently failing here left the app on
     the previous station with no clue anything had gone wrong. */
  let html;
  try{ html = S.launcher.open ? vLauncher() : VIEWS[S.view](); }
  catch(err){
    console.error('view failed:', S.view, err);
    html = `<div class="pad"><div class="card">
      <h3 style="color:var(--fail)">This station could not be drawn</h3>
      <p class="ch">The rest of the session is unaffected and everything entered is still saved.</p>
      <p class="mini" style="font-family:var(--font-mono,monospace)">${String(err&&err.message||err)}</p>
      <button class="btn ghost sm" onclick="go('review')">Go to reconciliation</button></div></div>`;
  }
  document.getElementById('content').innerHTML = html;
  drawSave(); autosave();
  // restore focus + caret so typing is never interrupted
  if(fIdx>-1){
    const list=[...document.getElementById('content').querySelectorAll('input')];
    const el=list[fIdx];
    if(el){el.focus();try{el.setSelectionRange(fs,fe);}catch(e){}}
  }
}

/* ---- spreadsheet-style keyboard navigation ----
   Tab / Shift-Tab : next / previous field (native)
   ArrowDown / Enter : same column, next row
   ArrowUp : same column, previous row
   ArrowLeft / ArrowRight : move field when the caret is at the edge  */
document.addEventListener('keydown',e=>{
  const el=e.target;
  if(!el||el.tagName!=='INPUT'||el.type==='checkbox') return;
  if(el.dataset&&el.dataset.nokeynav) return;   // search boxes keep native keys
  const C=document.getElementById('content'); if(!C||!C.contains(el)) return;
  const all=[...C.querySelectorAll('input:not([type=checkbox])')];
  const idx=all.indexOf(el);
  const go=t=>{ if(t){ e.preventDefault(); t.focus();
      try{ t.setSelectionRange(t.value.length,t.value.length); }catch(x){} } };
  const sameCell=dir=>{                       // stacked entries inside one cell
    const td=el.closest('td'); if(!td) return null;
    const ins=[...td.querySelectorAll('input:not([type=checkbox])')];
    const i=ins.indexOf(el);
    return (i>-1 && ins[i+dir]) ? ins[i+dir] : null;
  };
  const sameColumn=dir=>{
    const td=el.closest('td'), tr=el.closest('tr');
    if(!td||!tr) return null;
    const ci=td.cellIndex;
    let row = dir>0 ? tr.nextElementSibling : tr.previousElementSibling;
    while(row){
      const c=row.cells&&row.cells[ci];
      const inp=c&&c.querySelector('input:not([type=checkbox])');
      if(inp) return inp;
      row = dir>0 ? row.nextElementSibling : row.previousElementSibling;
    }
    return null;
  };
  if(e.key==='ArrowDown'||e.key==='Enter'){ go(sameCell(1)||sameColumn(1)||all[idx+1]); }
  else if(e.key==='ArrowUp'){ go(sameCell(-1)||sameColumn(-1)||all[idx-1]); }
  else if(e.key==='ArrowLeft' && el.selectionStart===0 && el.selectionEnd===0){ go(all[idx-1]); }
  else if(e.key==='ArrowRight' && el.selectionStart===el.value.length
          && el.selectionEnd===el.value.length){ go(all[idx+1]); }
});
/* The app always opens on the picker. Nothing is restored behind your back —
   a saved night is resumed by choosing it, not by being dropped into it. */
/* Demo build: always opens 14 August at Santa Clara, and deliberately ignores
   anything saved from a previous visit so it can never show another night. */
try{ Object.keys(localStorage).filter(k=>k.startsWith('recon:')).forEach(k=>localStorage.removeItem(k)); }catch(e){}
(function(){
  S.launcher.hall='sc'; S.launcher.date='2026-08-14';
  const list=slotsFor('sc','2026-08-14');
  if(list.length){ const s=list[0];
    S.session={hall:s.hall,hallName:s.hallName,date:'2026-08-14',weekday:s.weekday,time:s.time,slot:s.name};
    freshState(S.session); S.view='staff'; S.launcher.open=false;
  } else S.launcher.open=true;
})();
render();
</script>
